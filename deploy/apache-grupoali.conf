# /etc/apache2/sites-available/grupoali.conf
# VirtualHost Apache para o site estático Grupo Ali.
# O certbot --apache cria automaticamente o bloco HTTPS (porta 443) e o redirect.
# Requer módulos: headers, rewrite, ssl  ->  sudo a2enmod headers rewrite ssl

<VirtualHost *:80>
    ServerName grupoalidetetives.com.br
    ServerAlias www.grupoalidetetives.com.br
    DocumentRoot /var/www/grupoali

    <Directory /var/www/grupoali>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # ---- Segurança: headers ----
    Header always set X-Content-Type-Options   "nosniff"
    Header always set X-Frame-Options          "SAMEORIGIN"
    Header always set Referrer-Policy          "strict-origin-when-cross-origin"
    Header always set Permissions-Policy       "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.googletagmanager.com https://www.google.com https://www.google.com.br https://googleads.g.doubleclick.net; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://region1.google-analytics.com https://googleads.g.doubleclick.net https://www.google.com; frame-src https://td.doubleclick.net https://www.googletagmanager.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' mailto:; object-src 'none'; upgrade-insecure-requests"
    # HSTS (HTTPS já ativo via certbot):
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

    # (ServerTokens é diretiva GLOBAL do Apache — configure em
    #  /etc/apache2/conf-available/security.conf, não dentro do VirtualHost)
    ServerSignature Off

    # bloqueia dotfiles e .git (permite .well-known para o certbot)
    <DirectoryMatch "/\.(?!well-known)">
        Require all denied
    </DirectoryMatch>

    # bloqueia arquivos internos do repo expostos no docroot (deploy/, docs)
    <Directory /var/www/grupoali/deploy>
        Require all denied
    </Directory>
    <Directory /var/www/grupoali>
        <FilesMatch "^(CLAUDE|README|LICENSE)\.(md|txt)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # cache de assets
    <FilesMatch "\.(png|jpe?g|webp|svg|woff2?|ico)$">
        Header set Cache-Control "public, max-age=2592000, immutable"
    </FilesMatch>
    <FilesMatch "^index\.html$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/grupoali_error.log
    CustomLog ${APACHE_LOG_DIR}/grupoali_access.log combined
</VirtualHost>
