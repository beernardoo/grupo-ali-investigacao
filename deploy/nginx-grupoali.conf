# /etc/nginx/sites-available/grupoali  (symlink em sites-enabled)
# Substitua SEU_DOMINIO pelo domínio real. Certbot converte pra HTTPS automaticamente.
server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO www.SEU_DOMINIO;

    root /var/www/grupoali;
    index index.html;

    # ---- Segurança: headers ----
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    # HSTS: só ativa depois que o HTTPS estiver funcionando (certbot). Descomente:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    server_tokens off;                       # esconde versão do nginx
    add_header X-Robots-Tag "all" always;

    # cache de assets
    location ~* \.(png|jpg|jpeg|webp|svg|woff2?|ico)$ { expires 30d; add_header Cache-Control "public, immutable"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # bloqueia acesso a arquivos ocultos e ao .git
    location ~ /\.(?!well-known) { deny all; }

    location / { try_files $uri $uri/ =404; }
}
